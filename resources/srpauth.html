  <button onclick="login()">Login</button>

const N = BigInt('0x' + N_hex.replace(/\s+/g, '')); // Ensure no whitespace
const g = 2n;
const k = 3n;


    async function sha256(data) {
      if (!(data instanceof Uint8Array)) {
        throw new Error("sha256 expects Uint8Array");
      }
      const buffer = await window.crypto.subtle.digest("SHA-256", data);
      return new Uint8Array(buffer);
    }

    function textToBytes(text) {
      return new TextEncoder().encode(text);
    }

    function hexToBytes(hex) {
      return new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
    }

    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function bigIntToBytes(num) {
      let hex = num.toString(16);
      if (hex.length % 2) hex = '0' + hex;
      return hexToBytes(hex);
    }

    function modPow(base, exp, mod) {
      let result = 1n;
      base = base % mod;
      while (exp > 0) {
        if (exp % 2n === 1n) result = (result * base) % mod;
        exp = exp >> 1n;
        base = (base * base) % mod;
      }
      return result;
    }

    function xorBuffers(buf1, buf2) {
      return new Uint8Array(buf1.map((b, i) => b ^ buf2[i]));
    }

    async function register() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const result = await res.json();
      document.getElementById("output").textContent = JSON.stringify(result, null, 2);
    }

    async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const aBytes = crypto.getRandomValues(new Uint8Array(32));
  const aHex = Array.from(aBytes).map(b => b.toString(16).padStart(2, '0')).join('');
  const a = BigInt("0x" + aHex);
  const A = modPow(g, a, N);

  const startRes = await fetch("/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username })
  });
  const { salt, B, session_id } = await startRes.json();
  const saltBytes = hexToBytes(salt);

  const userPassHash = await sha256(textToBytes(`${username}:${password}`));
  const concat = new Uint8Array([...saltBytes, ...userPassHash]);
  const xH = await sha256(concat);
  const x = BigInt("0x" + bytesToHex(xH));

  const Bint = BigInt(B);
  const uH = await sha256(new Uint8Array([...bigIntToBytes(A), ...bigIntToBytes(Bint)]));
  const u = BigInt("0x" + bytesToHex(uH));

  const S = modPow((Bint - k * modPow(g, x, N) + N) % N, a + u * x, N);
  const K = await sha256(bigIntToBytes(S));

  const H_N = await sha256(bigIntToBytes(N));
  const H_g = await sha256(bigIntToBytes(g));
  const H_xor = xorBuffers(H_N, H_g);
  const H_user = await sha256(textToBytes(username));

  const M1_input = new Uint8Array([
    ...H_xor,
    ...H_user,
    ...saltBytes,
    ...bigIntToBytes(A),
    ...bigIntToBytes(Bint),
    ...K
  ]);
  const M1 = await sha256(M1_input);

  const verifyRes = await fetch("/verify", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      session_id,
      A: "0x" + A.toString(16),
      M1: bytesToHex(M1)
    })
  });

  const { M2: M2_hex } = await verifyRes.json(); // ADD
  const M2_server = hexToBytes(M2_hex);          // ADD

  const M2_input = new Uint8Array([
    ...bigIntToBytes(A),
    ...M1,
    ...K
  ]); // ADD
  const M2_expected = await sha256(M2_input);    // ADD

  const isVerified = bytesToHex(M2_expected) === bytesToHex(M2_server); // ADD

  const output = {
    sessionKey: bytesToHex(K),
    serverVerified: isVerified,
    M2_expected: bytesToHex(M2_expected),
    M2_server: bytesToHex(M2_server)
  };

  document.getElementById("output").textContent = JSON.stringify(output, null, 2);
}
