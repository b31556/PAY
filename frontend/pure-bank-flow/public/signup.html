<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SecureBank</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="min-h-screen bg-gradient">
        <div class="container">
            <div style="width: 100%; max-width: 400px;">
                <!-- Logo -->
                <div class="text-center mb-6">
                    <div class="logo-icon">🏦</div>
                    <h1 class="logo-title text-white">SecureBank</h1>
                    <p class="logo-subtitle text-white">Join our banking family</p>
                </div>

                <!-- Signup Card -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Create Account</h2>
                        <p class="card-description">Fill in your information to get started</p>
                    </div>
                    <div class="card-content">
                        <form id="signupForm" class="form">
                            <div class="form-group">
                                <label for="name" class="label">Full Name</label>
                                <input type="text" id="name" class="input" placeholder="John Doe" required>
                            </div>

                            <div class="form-group">
                                <label for="email" class="label">Email</label>
                                <input type="email" id="email" class="input" placeholder="john@example.com" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="password" class="label">Password</label>
                                <div style="position: relative;">
                                    <input type="password" id="password" class="input" placeholder="At least 8 characters" required style="padding-right: 3rem;">
                                    <button type="button" id="togglePassword" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">
                                        👁️
                                    </button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword" class="label">Confirm Password</label>
                                <div style="position: relative;">
                                    <input type="password" id="confirmPassword" class="input" placeholder="Confirm your password" required style="padding-right: 3rem;">
                                    <button type="button" id="toggleConfirmPassword" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">
                                        👁️
                                    </button>
                                </div>
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
                                Create Account
                            </button>
                        </form>

                        <div class="mt-4 text-center">
                            <p class="text-sm text-muted">
                                Already have an account? 
                                <a href="login.html" style="color: var(--banking-primary); text-decoration: none; font-weight: 500;">Sign in here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="banking-api.js"></script>
    <script>
        // Check if already logged in
        if (isAuthenticated()) {
            Redirect('dashboard.html');
        }

        const signupForm = document.getElementById('signupForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const togglePassword = document.getElementById('togglePassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

        // Toggle password visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
        });

        toggleConfirmPassword.addEventListener('click', () => {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            toggleConfirmPassword.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Validate form
        function validateForm() {
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!name || !email || !password || !confirmPassword) {
                showToast('Please fill in all fields', 'error');
                return false;
            }

            if (password.length < 8) {
                showToast('Password must be at least 8 characters long', 'error');
                return false;
            }

            if (password !== confirmPassword) {
                showToast('Passwords do not match', 'error');
                return false;
            }

            return true;
        }

        // Handle form submission
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!validateForm()) return;

            const formData = {
                name: nameInput.value.trim(),
                email: emailInput.value.trim(),
                password: passwordInput.value
            };

            // Show loading state
            submitBtn.innerHTML = '<span class="spinner"></span>Creating Account...';
            submitBtn.disabled = true;

            try {
                const response = await SendRequest('/signup', formData);
                
                if (response.success) {
                    showToast('Account created successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        Redirect('dashboard.html');
                    }, 1000);
                } else {
                    throw new Error('Signup failed');
                }
            } catch (error) {
                showToast(error.message || 'Failed to create account', 'error');
                submitBtn.innerHTML = 'Create Account';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
