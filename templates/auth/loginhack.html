        <h1>Log In to Your Account</h1>
        <p>Access your payment portal by signing in below.</p>
    </div>
    <div id="step2" class="hero" style="animation: fadeIn 1s ease-in; display: none;">

        <p>Please complete the security step</p>

            <label for="password">Password:</label><br>
            <input type="password" id="password" placeholder="Enter your password" style="width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: none; border-radius: 5px; background: rgba(255, 255, 255, 0.3); color: #fff;" required><br>
        </p>
        <button id="login-btn" class="btn" style="animation: bounce 0.3s ease-in-out;" onclick="login()">Log In</button>
    </div>
    <div id="step2-a" class="card" style="display: none;">

        <p>

        </p>
        <button id="login-btn-step2" class="btn" style="animation: bounce 0.3s ease-in-out;" onclick="step2login()">Log In</button>
    </div>

    <div class="loading-overlay" style="display: none;">

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Ensures it appears above all other content */
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3; /* Light gray border */
            border-top: 5px solid #3498db; /* Blue top border to create spinning effect */
            border-radius: 50%; /* Circular shape */
            animation: spin 1s linear infinite; /* Continuous spinning animation */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.4);
        }

      const ct = encrypted.slice(12);
      const pt = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
