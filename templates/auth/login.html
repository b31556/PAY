    <style id="dynamic-style">
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 3rem 1rem;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #fff;
        }

        .hero p {
            font-size: 1.2rem;
            color: #e0e0e0;
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .card p {
            color: #e0e0e0;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: #ffd700;
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
            border-radius: 5px;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .btn:hover {
            background: #ffca28;
            transform: scale(1.05);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .container {
                padding: 0 1rem;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Ensures it appears above all other content */
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3; /* Light gray border */
            border-top: 5px solid #3498db; /* Blue top border to create spinning effect */
            border-radius: 50%; /* Circular shape */
            animation: spin 1s linear infinite; /* Continuous spinning animation */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.4);
        }
    </style>

    async function sha256(data) {
      if (!(data instanceof Uint8Array)) {
        throw new Error("sha256 expects Uint8Array");
      }
      const buffer = await window.crypto.subtle.digest("SHA-256", data);
      return new Uint8Array(buffer);
    }

    function textToBytes(text) {
      return new TextEncoder().encode(text);
    }

    function hexToBytes(hex) {
      return new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
    }

    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function bigIntToBytes(num) {
      let hex = num.toString(16);
      if (hex.length % 2) hex = '0' + hex;
      return hexToBytes(hex);
    }

    function modPow(base, exp, mod) {
      let result = 1n;
      base = base % mod;
      while (exp > 0) {
        if (exp % 2n === 1n) result = (result * base) % mod;
        exp = exp >> 1n;
        base = (base * base) % mod;
      }
      return result;
    }

    function xorBuffers(buf1, buf2) {
      return new Uint8Array(buf1.map((b, i) => b ^ buf2[i]));
    }

    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) {
        bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
      }
      return bytes;
    }

    function bytesToHex(bytes) {
      return [...bytes].map(x => x.toString(16).padStart(2, "0")).join("");
    }

    async function encrypt(key, data) {
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const ct = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data);
      return new Uint8Array([...iv, ...new Uint8Array(ct)]);
    }

    async function decrypt(key, encrypted) {
      const iv = encrypted.slice(0, 12);
      const ct = encrypted.slice(12);
      const pt = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
      return new Uint8Array(pt);
    }

                  session_id: session_id // Include session ID for server tracking
                })
              }).then(async resp => {
                  document.querySelector('.loading-overlay').style.display = 'none';
                  if (resp.status !== 200) {
                    alert("Login failed.");
                    window.location.reload();
                    return;
                  }

                  const data = await resp.json();
                  if (data.response && data.signature) {
                    // Válasz dekódolása
                    const encryptedResp = hexToBytes(data.response);
                    const respNonce = encryptedResp.slice(0, 24);
                    const respCipher = encryptedResp.slice(24);
                    const decrypted = nacl.box.open(
                      respCipher,
                      respNonce,
                      serverEncPubKeyBytes,
                      clientPrivateKey
                    );
                    if (decrypted) {
                      // Ellenőrizzük a szerver szignatúráját
                      const serverValid = nacl.sign.detached.verify(
                        decrypted,
                        hexToBytes(data.signature),
                        serverSignPubKeyBytes
                      );
                      if (serverValid) {
                        // write the page url
                        const payload = JSON.parse(new TextDecoder().decode(decrypted));

                        document.body.innerHTML = payload.html || 'sorry error, please reload the page';

                        window.scrollTo(0, 0);

                        const scripts = payload.scripts || [];  // Notice: 'scripts', not 'script'

                        for (const code of scripts) {
                            const scriptTag = document.createElement('script');
                            scriptTag.textContent = code || '';
                            document.body.appendChild(scriptTag);
                        }

                        const styleTag = document.createElement('style');
                        styleTag.id = 'dynamic-style';
                        document.body.appendChild(styleTag);
                        styleTag.textContent = payload.style || 'text { color: #000; }';

                        document.title = payload.title || 'Payment Portal';


                      } else {
                        log("❌ Szerver válasza: szignatúra érvénytelen!");
                      }
                    } else {
                      log("❌ Nem sikerült visszafejteni a szerver válaszát!");
                    }
                  } else if (data.error) {
                    log("❌ Hiba: " + data.error);
                  }
                });
                

            } else {
              log("❌ Szerver válasza: szignatúra érvénytelen!");
            }
          } else {
            log("❌ Nem sikerült visszafejteni a szerver válaszát!");
          }
        } else if (data.error) {
          log("❌ Hiba: " + data.error);
        }
      });
    }
    


    

  </script>

</body>
